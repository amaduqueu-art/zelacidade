name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, typecheck e build
    runs-on: ubuntu-latest

    env:
      # Valores de placeholder: o build estático apenas embute as variáveis.
      # O deploy real usa as variáveis configuradas no Cloudflare Pages.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-ci-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build (static export)
        run: npm run build

      - name: Verificar artefato de export
        run: test -f out/index.html && echo "Static export OK"
